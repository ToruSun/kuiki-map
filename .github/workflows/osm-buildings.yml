# 区域マップ：OpenStreetMap の建物を、会衆の範囲の分だけ osm/buildings.json にする（仮の家の取り込みに使う）
# ・「Actions」→「OSM の建物」→「Run workflow」で作り直せます。毎月1日にも自動で作り直します
# ・できたファイルは main に入り、スプレッドシートのメニュー「OpenStreetMap から『仮の家』を取り込む」が読みます
name: OSM の建物
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 1 * *'   # 毎月2日 3:17（日本時間）
  push:
    branches: [main]
    paths: [tools/osm-buildings.py, .github/workflows/osm-buildings.yml]
permissions:
  contents: write
concurrency: { group: osm-buildings, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool >/dev/null
      - name: 建物を取り出す
        run: python3 tools/osm-buildings.py
      - name: main に入れる
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add osm/buildings.json
          if git diff --cached --quiet; then echo "変わりなし"; exit 0; fi
          git commit -qm "OSM の建物を作り直す（© OpenStreetMap contributors / ODbL）"
          git pull -q --rebase origin main && git push -q origin HEAD:main
